[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

large_types_passed_by_value = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[workspace.dependencies]
ab_glyph = "0.2"
anyhow = "1"
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
derive_more = { version = "2.1.1", default-features = false, features = [
  "deref",
  "deref_mut",
] }
eframe = { version = "0.35", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "inspection",
  "wgpu_no_default_features",
] }
egui = "0.35"
egui_code_editor = "0.3.7"
epaint_default_fonts = "0.35"
fontdb = "0.23"
iconflow = { version = "1", features = [
  "pack-bootstrap",
  "pack-lucide",
  "pack-phosphor",
  "pack-tabler",
] }
indoc = "2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "c1fe97a6bed015209d59e8772e4e9e49311d8bc5", features = [
  "png",
  "log",
] }
memchr = "2.8"
muda = "0.19"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSCursor",
  "NSScreen",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSGeometry",
  "objc2-core-foundation",
] }
pollster = "0.4"
png = "0.18"
portable-pty = "0.9"
proptest = "1"
rmux-client = "0.9.1"
rmux-sdk = "0.9.1"
keepawake = "0.6"
rmux-ipc = "0.9.1"
rmux-proto = "0.9.1"
rmux-server = { version = "0.9.1", default-features = false }
rstest = "0.26"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
smallvec = "1"
starship-battery = "0.11"
strum = { version = "0.28", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
syntect = { version = "5.3", default-features = false, features = [
  "default-fancy",
] }
tempfile = "3"
tokio = "1.48.0"
toml_edit = { version = "0.25", features = ["serde"] }
ttf-parser = "0.25"
tuirealm = { version = "4.1.0", default-features = false, features = [
  "derive",
] }
unicode-width = "0.2"
wasm-bindgen = "0.2"
wgpu = { version = "29", default-features = false, features = [
  "parking_lot",
  "std",
  "wgsl",
] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
embed-resource = "3.0.9"
windows-sys = "0.61"


[profile.dev]
debug = "limited"

[profile.profiling]
inherits = "release"
debug = "full"
lto = false
strip = false

[profile.release]
lto = "fat"
split-debuginfo = "off"

[profile.dynamic-release]
inherits = "release"
lto = false

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
debug = false
