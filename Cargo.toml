[package]
name = "bootty-tests"
version.workspace = true
edition.workspace = true
publish = false
autolib = false
autobins = false
autoexamples = false
autobenches = false

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

large_types_passed_by_value = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[workspace.dependencies]
ab_glyph = "0.2"
anyhow = "1"
arboard = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
derive_more = { version = "2.1.1", default-features = false, features = [
  "deref",
  "deref_mut",
] }
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "inspection",
  "wgpu_no_default_features",
] }
egui = "0.36"
fontdb = "0.23"
getrandom = "0.4"
iconflow = { version = "1", features = [
  "pack-bootstrap",
  "pack-lucide",
  "pack-phosphor",
  "pack-tabler",
] }
indoc = "2"
inventory = "0.3"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "10e8f5608bc3f9ced83c6fa51f44fd8031fa8ee0", features = [
  "png",
  "log",
] }
memchr = "2.8"
muda = "0.19"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSCursor",
  "NSScreen",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSString",
  "NSURL",
  "NSGeometry",
  "objc2-core-foundation",
] }
pollster = "0.4"
png = "0.18"
process-wrap = { version = "9.1", default-features = false, features = [
  "job-object",
  "process-group",
  "std",
] }
portable-pty = { git = "https://github.com/wezterm/wezterm.git", rev = "8afe0ad30739c5aa106c19e8a75b1dfc83bcfb56" }
proptest = "1"
rmux-client = "0.10"
rmux-sdk = "0.10"
keepawake = "0.6"
rmux-ipc = "0.10"
rmux-os = "0.10"
rmux-proto = "0.10"
rmux-server = { version = "0.10", default-features = false }
rstest = "0.26"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
smallvec = "1"
starship-battery = "0.11"
strum = { version = "0.28", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
syntect = { version = "5.3", default-features = false, features = [
  "default-fancy",
] }
tempfile = "3"
tokio = "1.53.1"
toml_edit = { version = "0.25", features = ["serde"] }
ttf-parser = "0.25"
tuirealm = { version = "4.1.0", default-features = false, features = [
  "derive",
] }
unicode-width = "0.2"
ureq = "3"
wasm-bindgen = "0.2"
wgpu = { version = "30", default-features = false, features = [
  "parking_lot",
  "std",
  "wgsl",
] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
embed-resource = "3.0.11"
windows-sys = "0.61"
winsafe = { version = "0.0.28", default-features = false, features = ["kernel"] }


[profile.dev]
debug = "limited"
# macOS would otherwise leave every codegen unit's object file in `target/debug/deps` forever: the
# executable's debug map points into them, so nothing ever removes them, and one rebuild of this
# workspace leaves hundreds behind. That directory is also where test binaries live, and the first
# CoreText call in a process enumerates the directory its executable sits in to look for bundled
# fonts — so an unbounded pile of objects turned into seconds of startup for every test that touches
# a font. Collect the debug info into one .dSYM per binary instead, which keeps debugging intact and
# leaves the directory bounded.
split-debuginfo = "packed"

[profile.profiling]
inherits = "release"
debug = "full"
lto = false
strip = false

[profile.release]
lto = "fat"
split-debuginfo = "off"

[profile.daemon-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dynamic-release]
inherits = "release"
lto = false

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
debug = false

[dev-dependencies]
bootty-app = { path = "crates/bootty-app" }
bootty-command = { path = "crates/bootty-command" }
bootty-config = { path = "crates/bootty-config" }
bootty-mux = { path = "crates/bootty-mux" }
bootty-rmux = { path = "crates/bootty-rmux" }
serde_json.workspace = true
tempfile.workspace = true
toml_edit.workspace = true

[dependencies]
bootty-workspace-hack = { version = "0.1", path = "crates/bootty-workspace-hack" }
