name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Tag workspace version and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:tag
