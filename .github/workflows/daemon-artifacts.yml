name: Daemon artifacts

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: Read daemon target manifest
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Build daemon target matrix
        id: targets
        run: |
          matrix="$(mise run daemon:matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    name: Daemon ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: daemon-${{ matrix.target }}
          cache-on-failure: true

      - name: Build daemon
        run: mise run daemon:build-one -- "${{ matrix.target }}"

      - name: Normalize daemon artifact
        run: mise run daemon:stage -- "${{ matrix.target }}" daemon-output

      - name: Check daemon size budget
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: mise run daemon:size -- daemon-output/bootty-daemon-x86_64-unknown-linux-gnu

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          if-no-files-found: error
          path: daemon-output/bootty-daemon-${{ matrix.target }}
