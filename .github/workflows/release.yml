name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  daemon-artifacts:
    name: Build daemon matrix
    uses: ./.github/workflows/daemon-artifacts.yml

  package:
    name: Package ${{ matrix.name }}
    needs: daemon-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-26
            artifact: bootty-macos-arm64
            package-asset: Bootty-macos-arm64.app.zip
            release-asset: bootty-aarch64-apple-darwin.zip
          - name: macos-x64
            runner: macos-15-intel
            artifact: bootty-macos-x64
            package-asset: Bootty-macos-x86_64.app.zip
            release-asset: bootty-x86_64-apple-darwin.zip
          - name: windows-x64
            runner: windows-2025
            artifact: bootty-windows-x64
            package-asset: Bootty-windows-x64.zip
            release-asset: bootty-x86_64-pc-windows-msvc.zip
          - name: linux-x64
            runner: ubuntu-24.04
            artifact: bootty-linux-x64
            package-asset: Bootty-linux-x86_64.tar.gz
            release-asset: bootty-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Verify release tag
        run: mise run release:verify-tag -- "$RELEASE_TAG"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-on-failure: true

      - name: Evict CPU-specific zig artifacts
        run: cargo clean -p libghostty-vt-sys

      - name: Download daemon matrix
        uses: actions/download-artifact@v5
        with:
          pattern: daemon-*
          path: target/bootty-daemons
          merge-multiple: true

      - name: Package native app
        env:
          BOOTTY_STRICT_MACOS_ICON: "1"
          BOOTTY_DAEMON_OUTPUT_DIR: target/bootty-daemons
        run: mise run package -- --static

      - name: Prepare release assets
        run: mise run release:rename-asset -- "dist/${{ matrix.package-asset }}" "dist/${{ matrix.release-asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.release-asset }}

  publish:
    name: Publish GitHub release
    needs: [package, daemon-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish -- "$RELEASE_TAG" release
