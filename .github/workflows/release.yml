name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  daemon-artifacts:
    name: Build daemon matrix
    uses: ./.github/workflows/daemon-artifacts.yml

  package:
    name: Package ${{ matrix.name }}
    needs: daemon-artifacts
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-26
            artifact: bootty-macos-arm64
            package-asset: Bootty-macos-arm64.app.zip
            release-asset: bootty-aarch64-apple-darwin.zip
          - name: macos-x64
            runner: macos-15-intel
            artifact: bootty-macos-x64
            package-asset: Bootty-macos-x86_64.app.zip
            release-asset: bootty-x86_64-apple-darwin.zip
          - name: windows-x64
            runner: windows-2025
            artifact: bootty-windows-x64
            package-asset: Bootty-windows-x64.zip
            release-asset: bootty-x86_64-pc-windows-msvc.zip
          - name: linux-x64
            runner: ubuntu-24.04
            artifact: bootty-linux-x64
            package-asset: Bootty-linux-x86_64.tar.gz
            release-asset: bootty-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag
        shell: bash
        run: test "v$(awk '$0 == "[workspace.package]" { in_workspace_package = 1; next } /^\[/ { in_workspace_package = 0 } in_workspace_package && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)" = "$RELEASE_TAG"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | head -1)/Contents/Developer"

      - name: Set up Homebrew Zig on macOS
        if: runner.os == 'macOS'
        run: |
          brew install zig@0.15
          zig_bin="$(brew --prefix zig@0.15)/bin/zig"
          echo "$(dirname "$zig_bin")" >> "$GITHUB_PATH"
          test "$("$zig_bin" version)" = "0.15.2"

      - name: Set up mise toolchain
        uses: jdx/mise-action@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
          cache-on-failure: true

      - name: Evict CPU-specific zig artifacts
        run: cargo clean -p libghostty-vt-sys

      - name: Download daemon matrix
        uses: actions/download-artifact@v5
        with:
          pattern: daemon-*
          path: target/bootty-daemons
          merge-multiple: true

      - name: Package native app on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: BOOTTY_STRICT_MACOS_ICON=1 BOOTTY_DAEMON_OUTPUT_DIR=target/bootty-daemons mise run package --static

      - name: Package native app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: $env:BOOTTY_DAEMON_OUTPUT_DIR = "target/bootty-daemons"; mise run package:windows --static

      - name: Prepare release assets
        shell: bash
        run: |
          mv "dist/${{ matrix.package-asset }}" "dist/${{ matrix.release-asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.release-asset }}

  publish:
    name: Publish GitHub release
    needs: [package, daemon-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$RELEASE_TAG"
