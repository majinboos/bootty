[env]
# Zig's Debug optimize mode miscompiles libghostty-vt on aarch64-windows
# (pervasive access violations in FFI calls). ReleaseSafe keeps runtime safety
# checks while producing a working library on every platform.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseSafe"

# On the first CoreText call in a process, macOS registers the fonts bundled with
# the running executable, and for a bare binary that means enumerating the entire
# directory the binary sits in. Test binaries live in `target/debug/deps`, which
# accumulates hundreds of thousands of build artifacts, so that single call cost
# ~5s per test process. CoreFoundation resolves the main bundle from `CFProcessPath`
# when it is set, so pointing it at an empty directory keeps the scan to a few
# milliseconds. Nothing here reads its own bundle resources, and the path has to
# name a file that exists, so borrow a system binary that lives in a small directory.
CFProcessPath = "/bin/sh"

[unstable]
codegen-backend = true

# Inventory submit uses Mach-O constructors unsupported by current macOS
# Cranelift. Only the four submitting crates use LLVM in development builds.
[profile.dev.package.bootty-native]
codegen-backend = "llvm"

[profile.dev.package.bootty-rmux]
codegen-backend = "llvm"

[profile.dev.package.bootty-tmux]
codegen-backend = "llvm"

[profile.dev.package.bootty-zellij]
codegen-backend = "llvm"

[profile.test]
# Current macOS Cranelift also aborts on SIMD emitted by the egui test path.
# The repository correctness gate must use one reliable backend for all tests.
codegen-backend = "llvm"
