[package]
name = "bootty-remote"
version.workspace = true
edition.workspace = true

[features]
default = ["app"]
app = ["terminfo", "bootty-mux/app"]
terminfo = ["dep:bootty-runtime"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
bootty-mux = { path = "../bootty-mux", default-features = false }
bootty-mux-model = { path = "../bootty-mux-model" }
bootty-runtime = { path = "../bootty-runtime", optional = true }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
bootty-workspace-hack = { version = "0.1", path = "../bootty-workspace-hack" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
