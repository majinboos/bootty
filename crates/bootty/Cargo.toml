[package]
name = "bootty"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
bootty-dev = ["bootty-app/bootty-dev"]

[[bin]]
name = "bootty"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bootty-app = { path = "../bootty-app" }
bootty-mux = { path = "../bootty-mux" }
bootty-native = { path = "../bootty-native" }
bootty-remote = { path = "../bootty-remote" }
bootty-rmux = { path = "../bootty-rmux" }
bootty-tmux = { path = "../bootty-tmux" }
bootty-zellij = { path = "../bootty-zellij" }
clap.workspace = true
serde_json.workspace = true
bootty-workspace-hack = { version = "0.1", path = "../bootty-workspace-hack" }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
egui.workspace = true
tempfile.workspace = true

[lints]
workspace = true
