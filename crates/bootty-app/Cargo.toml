[package]
name = "bootty-app"
version.workspace = true
edition.workspace = true

[features]
bootty-dev = ["bootty-identity/bootty-dev", "bootty-control/bootty-dev"]

[dependencies]
bootty-command = { path = "../bootty-command" }
bootty-control = { path = "../bootty-control" }
bootty-extension = { path = "../bootty-extension" }
anyhow.workspace = true
arboard.workspace = true
eframe.workspace = true
iconflow.workspace = true
libghostty-vt.workspace = true
bootty-winit = { path = "../bootty-winit", default-features = false }
bootty-font = { path = "../bootty-font" }
bootty-identity = { path = "../bootty-identity" }
bootty-config = { path = "../bootty-config" }
bootty-mux = { path = "../bootty-mux" }
bootty-remote = { path = "../bootty-remote" }
bootty-ui = { path = "../bootty-ui" }
bootty-render = { path = "../bootty-render" }
bootty-runtime = { path = "../bootty-runtime" }
bootty-terminal = { path = "../bootty-terminal" }
bootty-workspace = { path = "../bootty-workspace" }
png.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true
keepawake.workspace = true
thiserror.workspace = true
bootty-workspace-hack = { version = "0.1", path = "../bootty-workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
wgpu = { workspace = true, features = ["gles", "vulkan"] }
winit = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[dev-dependencies]
bootty-native = { path = "../bootty-native" }
bootty-rmux = { path = "../bootty-rmux" }
bootty-tmux = { path = "../bootty-tmux" }
bootty-winit = { path = "../bootty-winit", features = ["bare-host"] }
criterion.workspace = true
egui.workspace = true
pollster.workspace = true
pretty_assertions.workspace = true
rusqlite.workspace = true
rstest.workspace = true
tempfile.workspace = true

