[package]
name = "bootty-app"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
bootty-dev = []

[[bin]]
name = "bootty"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
eframe.workspace = true
egui_code_editor.workspace = true
iconflow.workspace = true
fontdb.workspace = true
libghostty-vt.workspace = true
bootty-winit = { path = "../bootty-winit", default-features = false }
bootty-config = { path = "../bootty-config" }
bootty-mux = { path = "../bootty-mux" }
bootty-ui = { path = "../bootty-ui" }
bootty-render = { path = "../bootty-render" }
bootty-runtime = { path = "../bootty-runtime" }
bootty-surface = { path = "../bootty-surface" }
bootty-terminal = { path = "../bootty-terminal" }
png.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
rmux-ipc.workspace = true
rmux-os.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "sync", "time"] }
self_update = { version = "1.0.0-rc.6", default-features = false, features = ["archive-tar", "archive-zip", "checksums", "compression-tar-gz", "compression-zip-deflate", "github", "rustls", "ureq"] }
starship-battery.workspace = true
strum.workspace = true
notify.workspace = true
sysinfo.workspace = true
ttf-parser.workspace = true
wgpu.workspace = true
winit.workspace = true
keepawake.workspace = true
mlua = { version = "0.12.0", features = ["luau"] }
bootty-workspace-hack = { version = "0.1", path = "../bootty-workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
wgpu = { workspace = true, features = ["gles", "vulkan"] }
winit = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bootty-winit = { path = "../bootty-winit", features = ["bare-host"] }
criterion.workspace = true
indoc.workspace = true
pollster.workspace = true
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true

