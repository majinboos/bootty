[package]
name = "bootty-mux"
edition.workspace = true
version.workspace = true

[features]
default = ["app", "remote-install"]
app = [
  "dep:bootty-config",
  "dep:bootty-runtime",
  "dep:bootty-surface",
  "dep:bootty-terminal",
  "dep:derive_more",
  "dep:libghostty-vt",
]
remote-install = ["app", "dep:sha2", "dep:ureq"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
derive_more = { workspace = true, optional = true }
libghostty-vt = { workspace = true, optional = true }
rmux-client.workspace = true
rmux-ipc.workspace = true
rmux-proto.workspace = true
rmux-sdk.workspace = true
rmux-server.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
ureq = { workspace = true, optional = true }
bootty-config = { path = "../bootty-config", optional = true }
bootty-runtime = { path = "../bootty-runtime", optional = true }
bootty-surface = { path = "../bootty-surface", optional = true }
bootty-terminal = { path = "../bootty-terminal", optional = true }


[dev-dependencies]
tempfile.workspace = true
