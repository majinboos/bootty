[package]
name = "bootty-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bootty-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bootty-config = { path = "../bootty-config" }
bootty-mux = { path = "../bootty-mux", default-features = false }
bootty-remote = { path = "../bootty-remote", default-features = false }
bootty-rmux = { path = "../bootty-rmux", default-features = false }
bootty-tmux = { path = "../bootty-tmux", default-features = false }
bootty-identity = { path = "../bootty-identity" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rmux-server.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
