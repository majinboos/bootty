[tools]
rust = "stable"
zig = "0.16.0"
"cargo:cargo-xwin" = "0.23.0"
"cargo:cargo-zigbuild" = "0.23.0"

[tasks.build]
description = "Build the bootty app with dynamic local linkage; pass --static for distribution or --fast for fast-release"
run = "./scripts/build-bootty-unix.sh"
run_windows = "pwsh ./scripts/build-bootty-windows.ps1"

[tasks.launch]
description = "Build and launch the bootty app; args after -- are passed to Bootty"
run = "./scripts/launch-bootty-unix.sh"
run_windows = "pwsh ./scripts/launch-bootty-windows.ps1"

[tasks."site:build"]
description = "Build the Cloudflare Pages site from Rust/WASM source"
run = """
#!/usr/bin/env bash
set -euo pipefail
rustup target add wasm32-unknown-unknown
bun install --frozen-lockfile
bun run build:web
"""

[tasks.test]
description = "Run workspace tests with nextest"
run = "cargo nextest run"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks."hakari:generate"]
description = "Regenerate the cargo-hakari workspace hack"
run = "cargo hakari generate && cargo hakari manage-deps --yes"

[tasks."hakari:check"]
description = "Check the cargo-hakari workspace hack is up to date"
run = "cargo hakari generate --diff && cargo hakari manage-deps --dry-run"

[tasks.clippy]
description = "Run clippy on the workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.bench]
description = "Validate and compile every benchmark; pass --ci-smoke or --quick to select a measured workflow"
run = "scripts/run-benchmark-suite.sh"

[tasks.release]
description = "Prepare and auto-merge a release; pass patch or major for a bump other than minor"
run = "./scripts/prepare-release.sh"

[tasks."daemon:build-all"]
description = "Build daemon assets for every target in the daemon target manifest"
run = "./scripts/build-bootty-daemons.sh"

[tasks.package]
description = "Package with the host daemon; pass --all-daemons for every remote target, --static for distribution, or --fast for fast-release"
run = "./scripts/package-bootty-unix.sh"

[tasks."package:dev"]
description = "Package the isolated BoottyDev application"
run = "./scripts/package-bootty-unix.sh --dev"

[tasks."package:windows"]
description = "Package the Windows zip from BOOTTY_DAEMON_OUTPUT_DIR; pass --static or --fast"
run = "pwsh ./scripts/package-bootty-windows.ps1"

[tasks.install]
description = "Package and install Bootty with the host daemon; pass --fast for fast-release"
run = "./scripts/install-bootty-unix.sh"
run_windows = "pwsh ./scripts/install-bootty-windows.ps1"

[tasks."install:dev"]
description = "Package and install the isolated BoottyDev application"
run = "./scripts/install-bootty-unix.sh --dev"
