# Complete Bootty configuration sample.
# Copy to $XDG_CONFIG_HOME/bootty/config.toml, usually ~/.config/bootty/config.toml.
#
# This file intentionally lists every currently supported top-level setting and
# table. Unknown fields are rejected, and active keybind actions must be backed
# by executable Bootty behavior.

version = 1

# Includes are applied after this file, so local overrides can replace values
# below. The leading ? makes this include optional.
include = [
  "?local.toml",
  # "shared.toml",
]

# Built-ins today:
#   Catppuccin Mocha
#   Catppuccin Latte
#   TokyoNight Night
#   Gruvbox Dark
#
# User themes are loaded from themes/<name>.toml or themes/<name>/theme.toml
# next to this config file before falling back to the built-in catalog.
theme = "Catppuccin Mocha"

[window]
# Title/fullscreen/decorations are live-reloaded where supported.
# Width/height and macOS titlebar style are startup/new-window settings.
title = "Bootty"
width = 1220
height = 760
fullscreen = false
window-decoration = "auto"
macos-titlebar-style = "transparent"
# Top offset reserved when the window covers a notched screen in fullscreen, so the sidebar and
# terminal clear the notch. Omitted (the default) auto-detects the notch height from the display's
# safe area; set a number to override.
# fullscreen-top-offset = 32
# When fullscreen on a notched screen, let the terminal/tab bar sit inside the notch band (beside
# the camera) instead of being pushed entirely below it. The notch strip uses the sidebar's
# fullscreen background. Set false to push everything below the notch.
fullscreen-tabs-in-notch = true

[font]
# Live-reloaded terminal text metrics.
family = ["monospace"]
size = 15
# Optional fixed cell metric overrides; omit to derive from font size.
# cell-width = 10
# cell-height = 22
# Enabled by default: stretch row spacing slightly so the terminal grid fills the available height.
fit-cell-height = true

[chrome]
# Live-reloaded app chrome. The default modules are in the top bar; enable the bottom bar
# independently when its configured modules should be visible.
sidebar = true
top-bar = true
bottom-bar = false
sidebar-width = 286
status-height = 30
# status-background = "#11131a"
# In dark mode on notched fullscreen displays, use solid black for sidebar,
# top/bottom bars, and split dividers so the notch band blends into the screen.
notched-fullscreen-black-chrome = true
gap = 1
# Dim inactive panes by overlay opacity in the 0.0-1.0 range.
unfocused-sidebar-dim = 0.16
unfocused-terminal-dim = 0.08

# Top- and bottom-bar segments are each composed left/center/right. Each segment names a Luau
# module: a built-in (session, windows, clock, sysinfo) or a *.luau file stem under
# ~/.config/bootty/status/. Built-ins are overridable by a same-named file. Only referenced modules
# in visible bars run. Items carry an optional lucide icon slug (rendered as an SVG via the sidebar
# icon set, not a glyph font) and fg/bg fills the module leaves unset. The session/windows built-ins
# tint with the session's sidebar color via bootty.session_color(); see docs/status/.
[[chrome.top-segment]]
align = "left"
module = "session"

[[chrome.top-segment]]
align = "left"
module = "windows"

[[chrome.top-segment]]
align = "right"
module = "sysinfo"

[[chrome.top-segment]]
align = "right"
module = "clock"

# To place a module below the terminal, set bottom-bar = true and add entries here.
# [[chrome.bottom-segment]]
# align = "right"
# module = "clock"

[sidebar]
# Sidebar placement and color overrides. Drag the sidebar's inner edge to resize
# (writes back to chrome.sidebar-width). Colors layer on top of the active theme;
# any unset slot falls back to the theme-derived value.
position = "left" # or "right"
# background = "#11131a"
# foreground = "#cdd6f4"
# selected = "#2a2f3d" # active session row tint
# hover = "#1e222c"
# border = "#313244" # edge border and footer separator
# Overall sidebar modules remain separate from the pieces rendered for every session.
# modules = ["sessions", "codexbar"]
# session-modules = ["diffs", "process", "agent", "directory", "branch", "ports", "progress"]

[multiplexer]
# native keeps mux state and terminals inside Bootty. rmux renders through
# rmux-sdk. herdr and tmux attach through their own backend UIs.
backend = "native"
# Herdr backend only: select the named Herdr server used by its stock client.
herdr-session = "default"
# tmux backend only: hide tmux's own status bar inside Bootty's client by
# toggling the attached session's status option off (restored on detach), so
# Bootty's native status bar is the only one shown. Session-scoped and
# reversible; never a global or permanent disable. If you also attach the same
# session from another terminal at the same time, its bar is hidden there too
# until Bootty detaches.
hide-tmux-status = false

# Reach a multiplexer on another host over SSH and render its sessions here.
# Herdr must already be installed there. Bootty automatically installs its
# small headless daemon when remote Space catalog operations need it. The full
# Bootty app is not required on the remote host.
# [multiplexer.remote]
# host = "devbox"       # ~/.ssh/config alias, hostname, or address
# user = "dev"         # when ~/.ssh/config does not name one
# port = 2222           # when ~/.ssh/config does not name one
# program = "ssh"       # the SSH client to run
# args = ["-i", "~/.ssh/devbox"] # extra flags, passed before the destination

[input]
# Active keybinds must use executable Bootty actions. Unsupported actions are
# rejected during startup/reload instead of being silently accepted.
#
# Trigger syntax:
#   modifiers: shift, ctrl/control, alt/opt/option, cmd/command/super
#   examples: cmd+shift+,, ctrl+c, alt+ArrowUp, shift+Tab
#   supported physical names today: KeyA, KeyB, KeyC, Digit0, ArrowUp,
#     ArrowDown, Quote, Enter, Tab, Backspace
#   single-character keys such as a, b, c, ,, /, = and named "space" are also accepted
#   flags: all:, global:, unconsumed:, performable:
#   sequences use > and chained actions use chain=
keybind = [
  # Common app/window actions.
  "clear",
  "cmd+shift+r=reload_config",
  "cmd+-=decrease_font_size:1",
  "cmd+==increase_font_size:1",
  "cmd++=increase_font_size:1",
  "cmd+0=reset_font_size",
  "alt+shift+scroll_up=increase_font_size:0.25",
  "alt+shift+scroll_down=decrease_font_size:0.25",
  "performable:cmd+v=paste_from_clipboard",
  "shift+Enter=text:\\n",
  "cmd+alt+n=new_window",
  "cmd+shift+w=close_window",
  "cmd+w=close_surface",
  "cmd+q=quit",
  "cmd+alt+ctrl+f=toggle_fullscreen",
  "cmd+n=new_mux_session",
  "cmd+p=session_picker",
  "cmd+o=toggle_sidebar_focus",
  "cmd+shift+e=toggle_sidebar_visibility",
  "ctrl+tab=last_session",
  "ctrl+shift+Tab=last_session",
  "cmd+shift+n=next_session",
  "cmd+shift+]=next_session",
  "cmd+shift+p=previous_session",
  "cmd+shift+[=previous_session",
  "cmd+shift+,=move_session:-1",
  "cmd+shift+.=move_session:1",
  "cmd+1=select_session:1",
  "cmd+2=select_session:2",
  "cmd+3=select_session:3",
  "cmd+4=select_session:4",
  "cmd+5=select_session:5",
  "cmd+6=select_session:6",
  "cmd+7=select_session:7",
  "cmd+8=select_session:8",
  "cmd+9=select_session:9",
  "cmd+alt+x=ditch_session",
]

# Sidebar-local keybinds apply only while the sidebar owns keyboard focus.
# Enter activates the hovered session and returns focus to the terminal.
sidebar-keybind = [
  "Enter=activate_session",
  "j=next_session",
  "ArrowDown=next_session",
  "ctrl+n=next_session",
  "k=previous_session",
  "ArrowUp=previous_session",
  "ctrl+p=previous_session",
]

# Hide the mouse pointer after terminal typing; moving the pointer shows it again.
hide-mouse-pointer-while-typing = true

# Copy a completed mouse selection to the system clipboard.
copy-on-select = false

# macOS Option-as-Meta behavior. Values: none, left, right, both.
macos-option-as-alt = "both"

# Optional backend-specific shards are appended only for the selected backend.
# Modifier remaps are live-reloaded and apply to egui and direct input paths.
# Supported sides include left/right shift, alt, ctrl, and command.
modifier-remap = [
  "right_alt=left_ctrl",
  # "right_command=left_alt",
]

[input.backend-keybind]
# Herdr defaults to the same native layout commands as the native and rmux
# backends. This shard can replace or extend them for one installation.
# herdr = ["cmd+d=split_right", "cmd+shift+d=split_down"]

tmux = [
  # Custom CSI relays registered as tmux user-keys in ~/.tmux.conf.
  "cmd+;=csi:61~",
  "cmd+ctrl+n=csi:68~",
  "ctrl+alt+[=csi:69~",
  "cmd+y=csi:71~",
  "cmd+c=csi:72~",
  "alt+n=esc:N",
  "alt+p=esc:P",
  "alt+h=esc:H",
  "alt+j=esc:J",
  "alt+k=esc:K",
  "alt+l=esc:L",
  "alt+x=esc:X",
  "alt+z=esc:Z",
  "ctrl+space=text:\\x00",
]

native = [
  "ctrl+space>c=new_tab",
  "ctrl+space>v=split_right",
  "ctrl+space>-=split_down",
  "ctrl+space>s=new_mux_session",
  "ctrl+space>x=ditch_session",
  "ctrl+space>shift+x=ditch_session",
  "ctrl+space>1=select_session:1",
  "ctrl+space>2=select_session:2",
  "ctrl+space>3=select_session:3",
  "ctrl+space>4=select_session:4",
  "ctrl+space>5=select_session:5",
  "ctrl+space>6=select_session:6",
  "ctrl+space>7=select_session:7",
  "ctrl+space>8=select_session:8",
  "ctrl+space>9=select_session:9",
  "ctrl+space>shift+,=move_tab:-1",
  "ctrl+space>shift+.=move_tab:1",
  "left_alt+shift+n=next_tab",
  "left_alt+shift+p=previous_tab",
  "alt+shift+]=next_tab",
  "alt+shift+[=previous_tab",
  "alt+Tab=last_tab",
  "alt+1=select_tab:1",
  "alt+2=select_tab:2",
  "alt+3=select_tab:3",
  "alt+4=select_tab:4",
  "alt+5=select_tab:5",
  "alt+6=select_tab:6",
  "alt+7=select_tab:7",
  "alt+8=select_tab:8",
  "alt+9=select_tab:9",
  "left_alt+shift+,=move_tab:-1",
  "left_alt+shift+.=move_tab:1",
  "alt+shift+h=select_pane:left",
  "alt+shift+j=select_pane:down",
  "alt+shift+k=select_pane:up",
  "alt+shift+l=select_pane:right",
  "alt+shift+o=next_pane",
  "alt+shift+x=kill_pane",
  "alt+shift+z=toggle_pane_zoom",
  "cmd+y=scroll_page_up",
  "cmd+shift+y=scroll_page_down",
  "cmd+ArrowUp=scroll_page_lines:-1",
  "cmd+ArrowDown=scroll_page_lines:1",
]


[session]
# Session settings apply to newly-created sessions; reload will not restart the
# current shell. Leave these unset unless you intentionally want Bootty to
# override the account login shell, inherited working directory, or environment.
# shell = "/opt/homebrew/bin/fish"
# working-directory = "/Users/alice/src/project"
# env = [
#   { name = "EDITOR", value = "nvim" },
# ]
# term = "xterm-bootty"
# colorterm = "truecolor"
# Ghostty Glyph Protocol APC handling. Enabled by default; disable if an app's
# custom glyph sequences cause compatibility issues.
glyph-protocol = true

[cursor]
# Live-reloaded default used when applications reset the cursor style (CSI 0 q).
# style accepts: block, bar, underline, hollow-block.
style = "block"
blink = false
# Keep cursors steady and slightly dimmer outside the focused pane.
dim-inactive-pane = true

[diagnostics]
# Live-reloaded. Set to a writable path to record frame/status stability data.
stability-trace = "/tmp/bootty-stability.csv"

[colors]
# Terminal colors are overlaid on the selected theme and live-reloaded.
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor = "#f5e0dc"
cursor-text = "#11111b"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"

# Extended palette generation. When enabled, entries 16-255
# are generated from the base colors using CIELAB interpolation;
# explicitly listed palette entries are preserved.
palette-generate = false
palette-harmonious = false

# Up to 256 palette entries are accepted. The first 16 entries are the standard
# ANSI colors: black, red, green, yellow, blue, magenta, cyan, white, then
# bright black through bright white.
palette = [
  "#45475a", # black
  "#f38ba8", # red
  "#a6e3a1", # green
  "#f9e2af", # yellow
  "#89b4fa", # blue
  "#f5c2e7", # magenta
  "#94e2d5", # cyan
  "#bac2de", # white
  "#585b70", # bright black
  "#f38ba8", # bright red
  "#a6e3a1", # bright green
  "#f9e2af", # bright yellow
  "#89b4fa", # bright blue
  "#f5c2e7", # bright magenta
  "#94e2d5", # bright cyan
  "#a6adc8", # bright white

  # Optional extended palette entries 16-255 can be listed here.
  # "#f5e0dc",
  # "#cba6f7",
]
